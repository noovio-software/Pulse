# /etc/nginx/sites-available/landingpagepulse — activé par cutover-noovio.sh, pas avant : il reprend les noms de l'ancien site.
# certbot ajoute ensuite les blocs 443 et la redirection HTTP → HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name www.noovio.fr;

    # Pas de WebSocket ici : le site est rendu côté serveur, sans circuit Blazor.
    location / {
        proxy_pass         http://127.0.0.1:8520;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

# L'adresse de référence est www.noovio.fr : le domaine nu y renvoie.
server {
    listen 80;
    listen [::]:80;
    server_name noovio.fr;

    return 301 https://www.noovio.fr$request_uri;
}

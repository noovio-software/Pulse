<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 128">
  <!-- Bandeau de la fenêtre : fond sombre, lueur violette, tracé de pouls discret. Source de Media/Header.tga. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1B1036" />
      <stop offset="0.6" stop-color="#0F1220" />
      <stop offset="1" stop-color="#0B0E14" />
    </linearGradient>
    <radialGradient id="glow" cx="12%" cy="50%" r="40%">
      <stop offset="0" stop-color="#7C3AED" stop-opacity="0.5" />

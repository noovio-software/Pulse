# /etc/nginx/sites-available/pulseadmin — certbot ajoute ensuite le bloc 443 et la redirection HTTP → HTTPS.
# Rendu statique (pas de circuit Blazor) : pas de WebSocket à relayer.
server {
    listen 80;
    listen [::]:80;
    server_name pulseadmin.noovio.fr;

    # Jamais indexé, même si l'adresse fuit (le site pose aussi X-Robots-Tag et robots.txt).
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass         http://127.0.0.1:8560;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }
}

# /etc/nginx/sites-available/pulsemetrics-legacy — anciennes adresses, renvoyées vers PulseMetrics.
# certbot ajoute ensuite les blocs 443 (setup-server.sh), pour que les anciens liens HTTPS redirigent aussi.
server {
    listen 80;
    listen [::]:80;
    server_name altpulse.noovio.fr;
    return 301 https://pulsemetrics.fr/alt$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name frontpulse.noovio.fr;
    return 301 https://pulsemetrics.fr/front$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name lifepulse.noovio.fr;
    return 301 https://pulsemetrics.fr/life$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name burstpulse.noovio.fr;
    return 301 https://pulsemetrics.fr/burst$request_uri;
}

# L'ancienne page d'accueil : /altpulse, /frontpulse… et /addon sont redirigés par l'application (Redirects).
server {
    listen 80;
    listen [::]:80;
    server_name noovio.fr www.noovio.fr;
    return 301 https://pulsemetrics.fr$request_uri;
}

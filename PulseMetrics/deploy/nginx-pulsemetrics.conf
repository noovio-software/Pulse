# /etc/nginx/sites-available/pulsemetrics — certbot ajoute ensuite les blocs 443 et la redirection HTTP → HTTPS.
# Un seul processus derrière : PulseMetrics aiguille lui-même /, /alt/, /front/, /life/ et /burst/.
map $http_upgrade $pulsemetrics_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name pulsemetrics.fr;

    location / {
        proxy_pass         http://127.0.0.1:8580;
        proxy_http_version 1.1;

        # WebSocket des circuits Blazor (Alt, Front, Life, Burst)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $pulsemetrics_connection_upgrade;
        proxy_read_timeout 3600s;

        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Le cookie de connexion porte le jeton Battle.net : en-têtes de réponse plus gros que la valeur par défaut.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }
}

# L'adresse de référence est pulsemetrics.fr, sans www.
server {
    listen 80;
    listen [::]:80;
    server_name www.pulsemetrics.fr;

    return 301 https://pulsemetrics.fr$request_uri;
}

# /etc/nginx/sites-available/burstpulse — certbot ajoute ensuite le bloc 443 et la redirection HTTP → HTTPS.
map $http_upgrade $burstpulse_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name burstpulse.noovio.fr;

    location / {
        proxy_pass         http://127.0.0.1:8540;
        proxy_http_version 1.1;

        # WebSocket du circuit Blazor (Interactive Server)
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection $burstpulse_connection_upgrade;
        proxy_read_timeout 3600s;

        proxy_set_header   Host $host;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Le cookie de connexion porte le jeton Battle.net : en-têtes de réponse plus gros que la valeur par défaut.
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;
    }
}

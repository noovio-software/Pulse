# PostgreSQL + Redis de développement, alignés sur appsettings.Development.json.
#   docker compose -f BurstPulse/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: burstpulse
      POSTGRES_USER: burstpulse
      POSTGRES_PASSWORD: burstpulse
    ports:
      - "5432:5432"
    volumes:
      - burstpulse-pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  burstpulse-pg:

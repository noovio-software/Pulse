name: AltPulse

# Déploiement en prod sur un tag, ex. : git tag prod-altpulse-1.0.0 && git push origin prod-altpulse-1.0.0
on:
  push:
    tags:
      - 'prod-altpulse-[0-9]+.[0-9]+.[0-9]+'

# Un seul déploiement à la fois : un tag poussé pendant un déploiement attend la fin du précédent.
concurrency:
  group: altpulse-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Extract version from tag
        run: |
          TAG_NAME="${GITHUB_REF##*/}"
          VERSION="${TAG_NAME#prod-altpulse-}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "::notice title=Build version::$VERSION"

      - name: Clean deploy directory
        run: rm -rf deploy

      # Le projet serveur référence AltPulse.Client : le WebAssembly est publié avec.
      # Pas de -p:Version : la variable VERSION posée ci-dessus est lue par le .csproj.
      - name: Dotnet Publish
        run: dotnet publish AltPulse/AltPulse/AltPulse.csproj -c Release -o deploy

      - name: Install SSH Key
        uses: shimataro/ssh-key-action@v2
        with:
          key: ${{ secrets.REMOTE_KEY }}
          known_hosts: 'altpulse-githubactions-known-hosts'

      - name: Adding Known Hosts
        run: ssh-keyscan -H ${{ secrets.REMOTE_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy with rsync
        run: rsync -avz deploy/ ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }}:${{ secrets.REMOTE_TARGET_APP }}

      # is-active échoue (et fait échouer le job) si le service n'a pas redémarré.
      - name: Restart service
        run: ssh ${{ secrets.REMOTE_USER }}@${{ secrets.REMOTE_HOST }} 'sudo systemctl restart kestrel-altpulse.service && sleep 5 && systemctl is-active kestrel-altpulse.service'

      - name: Smoke test
        run: curl -fsS -o /dev/null -w "HTTP %{http_code}\n" https://altpulse.noovio.fr/

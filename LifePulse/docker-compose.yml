# PostgreSQL + Redis de développement, alignés sur appsettings.Development.json.
#   docker compose -f LifePulse/docker-compose.yml up -d
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: lifepulse
      POSTGRES_USER: lifepulse
      POSTGRES_PASSWORD: lifepulse
    ports:
      - "5432:5432"
    volumes:
      - lifepulse-pg:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  lifepulse-pg:
